<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordtrail Grammar</title>
<meta name="theme-color" content="#1F2A44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WT Grammar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&amp;family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  var wantUpdate = false;
  function showUpdate(worker) {
    if (document.getElementById('updateBar')) return;
    var bar = document.createElement('div');
    bar.id = 'updateBar';
    bar.className = 'update-bar';
    bar.setAttribute('role', 'status');
    var msg = document.createElement('span');
    msg.textContent = 'নতুন সংস্করণ এসেছে';
    var ok = document.createElement('button');
    ok.type = 'button';
    ok.textContent = 'আপডেট করো';
    ok.onclick = function () { wantUpdate = true; worker.postMessage('SKIP_WAITING'); };
    var later = document.createElement('button');
    later.type = 'button';
    later.className = 'later';
    later.textContent = 'পরে';
    later.onclick = function () { bar.remove(); };
    bar.appendChild(msg); bar.appendChild(ok); bar.appendChild(later);
    document.body.appendChild(bar);
  }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(w);
        });
      });
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (wantUpdate) location.reload();
  });
}
</script>
</body>
</html>
